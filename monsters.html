<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>The Forge - Quái vật & Boss</title>

<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Catamaran,sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a);
    color:#e5e7eb;
    line-height:1.6;
}

/* ===== NÚT TRANG CHỦ ===== */
.home-btn{
    position:fixed;
    top:1rem;
    left:1rem;
    z-index:2000;
    padding:.55rem 1.3rem;
    border-radius:.9rem;
    background:linear-gradient(135deg,#22d3ee,#38bdf8);
    color:#020617;
    font-weight:bold;
    text-decoration:none;
    transition:.3s;
}
.home-btn:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 20px rgba(34,211,238,.6);
}

/* HEADER */
header{
    text-align:center;
    padding:3.5rem 1rem 2.5rem;
    border-bottom:1px solid #1f2937;
}
header h1{
    font-size:3rem;
    color:#f43f5e;
}
header p{
    color:#94a3b8;
    margin-top:.5rem;
}

/* CONTAINER */
.container{
    width:min(92%,1100px);
    margin:3rem auto;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:2rem;
}

/* CARD */
.card{
    background:rgba(15,23,42,.9);
    border:1px solid #1f2937;
    border-radius:1.3rem;
    padding:2rem;
    cursor:pointer;
    position:relative;
    transition:.3s ease;
}
.card:hover{
    transform:translateY(-8px) scale(1.02);
    border-color:#f43f5e;
}

.card span{
    font-size:.9rem;
    color:#a78bfa;
    font-weight:bold;
}
.card h3{
    color:#facc15;
    font-size:1.7rem;
    margin:.4rem 0;
}
.card p{
    color:#cbd5f5;
}

/* BOSS */
.boss{
    border-color:#7c3aed;
}
.boss h3{
    color:#a855f7;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(2,6,23,.85);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:1000;
}
.modal.active{
    opacity:1;
    pointer-events:auto;
}

.modal-box{
    background:linear-gradient(135deg,#020617,#0f172a);
    border-radius:1.6rem;
    padding:2.5rem;
    width:min(90%,420px);
}

.close-btn{
    margin-top:2rem;
    padding:.6rem 1.4rem;
    background:#f43f5e;
    border-radius:.8rem;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* FOOTER */
footer{
    text-align:center;
    padding:1.5rem;
    border-top:1px solid #1f2937;
    color:#94a3b8;
    margin-top:3rem;
}
</style>
</head>

<body>

<!-- ✅ LINK ĐÃ FIX – KHÔNG 404 -->
<a href="../index.html" class="home-btn">🏠 Trang chủ</a>

<header>
    <h1>Quái vật & Boss</h1>
    <p>Những kẻ thù nguy hiểm nhất tại Đảo 3 – The Forge</p>
</header>

<main class="container">
<section class="grid">

    <div class="card boss"
        data-name="Stone Golem"
        data-type="Boss"
        data-desc="Sinh vật bằng đá cổ đại với lớp phòng thủ cực cao.">
        <span>Boss</span>
        <h3>Stone Golem</h3>
        <p>Boss phòng thủ cực cao.</p>
    </div>

    <div class="card"
        data-name="Shadow Wolf"
        data-type="Quái vật"
        data-desc="Sói bóng tối tấn công cực nhanh.">
        <span>Quái vật</span>
        <h3>Shadow Wolf</h3>
        <p>Sói bóng tối nguy hiểm.</p>
    </div>

</section>
</main>

<footer>
    © 2026 The Forge — Dark Fantasy RPG
</footer>

<div class="modal" id="modal">
    <div class="modal-box">
        <span id="modalType"></span>
        <h2 id="modalName"></h2>
        <p id="modalDesc"></p>
        <div class="close-btn" id="closeModal">Đóng</div>
    </div>
</div>

<script>
const cards=document.querySelectorAll('.card');
const modal=document.getElementById('modal');
const modalName=document.getElementById('modalName');
const modalType=document.getElementById('modalType');
const modalDesc=document.getElementById('modalDesc');
const closeModal=document.getElementById('closeModal');

cards.forEach(card=>{
    card.onclick=()=>{
        modalName.textContent=card.dataset.name;
        modalType.textContent=card.dataset.type;
        modalDesc.textContent=card.dataset.desc;
        modal.classList.add('active');
    }
});

closeModal.onclick=()=>modal.classList.remove('active');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('active')}
</script>

</body>
</html>
